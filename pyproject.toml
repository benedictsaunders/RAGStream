[project]
name = "ragstream"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Benedict Saunders" }
]
requires-python = ">=3.13"
dependencies = [
    "arxiv>=4.0.1",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.2",
    "pandas>=3.0.5",
    "pymupdf>=1.28.2",
    "tqdm>=4.70.0",
]

[project.scripts]
ragstream = "ragstream:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
